<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting to Alex's Restaurant</title>
<script>
  var base = "/Restaurant-a-la-blanks";
  var p = location.pathname + location.search + location.hash;
  if (location.pathname.indexOf(base) !== 0) {
    location.replace(base + p);
  } else {
    location.replace(base + "/");
  }
</script>
<meta http-equiv="refresh" content="1;url=/Restaurant-a-la-blanks/">
</head>
<body>
<p>Redirecting to <a href="/Restaurant-a-la-blanks/">Alex's Restaurant</a>...</p>
</body>
</html>
